[package]
name = "warp-snapit"
version = "0.1.3"
edition = "2024"
description = "SnapIt — Windows zone snapper (Rust port of Warp Station's Tools.SnapIt companion)"
license = "GPL-3.0"
repository = "https://github.com/enginkirmaci/warp-snapit"
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }

[build-dependencies]
# the kit line is pinned by tag; warp-suite's [patch] points it at kits/ in the
# local symlinked build
warpui-kit-build = { git = "https://github.com/enginkirmaci/warp-suite", tag = "kits-v0.1.11", package = "warpui-kit-build" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
